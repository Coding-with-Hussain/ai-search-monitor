# Supabase CLI configuration for local development (`supabase start`).
# Docs: https://supabase.com/docs/guides/local-development
project_id = "ai-search-visibility-monitor"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
# Local email testing UI (magic links, password resets): http://127.0.0.1:54324
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3100/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Turn on in production so users verify their address.
enable_confirmations = false
double_confirm_changes = true
